name: ci

on:
  push:
    # WHY THIS LIST AND NOT `[master]` -- do not tidy it back.
    #
    # `pull_request` covers pushes to a branch that HAS a PR, and nothing
    # else. Every push to a branch with no PR -- the ordinary state of a
    # branch under development -- ran no CI at all, so the suite reported
    # success on commits nobody had checked. The branches below are the ones
    # that exist, taken from `git branch -a` rather than guessed; each has
    # commits that master does not:
    #
    #   master                 -- the integration branch, and the default.
    #   feat/packaging         -- the `files` allowlist and release workflow.
    #   fix/ci-checkout-order  -- actions/checkout ordering in this workflow.
    #   ci/github-actions      -- the actions v5 migration.
    #   fix/review-findings    -- the current review lane; the branch this
    #                             list was fixed on.
    #
    # A new development branch inherits no trigger until it is added here,
    # which is a gap -- but the alternative, listing nothing but master, is
    # the gap that hid four branches from CI for the life of the suite. Keep
    # this list in step with `git branch -a` when a branch is created.
    branches:
      - master
      - feat/packaging
      - fix/ci-checkout-order
      - ci/github-actions
      - fix/review-findings
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================================================
  # THERE IS NO GATE ON THIS JOB ANYMORE.
  #
  # It used to carry `if: ${{ vars.CONSUMER_REPOS_ENABLED == '1' }}` and
  # `vars.*` is a REPOSITORY VARIABLE, which nobody had set -- so the whole
  # workflow reported SUCCESS having executed zero jobs, which is
  # indistinguishable from a passing build. The gate is gone; what replaced
  # it is the `coverage-audit` job at the bottom of this file, and the rule
  # is absolute:
  #
  #   either the checks run, or the workflow is visibly NOT-PASSED.
  #
  # There is never a green run in which nothing was verified.
  # ===========================================================================
  test:
    name: unit tests, typecheck, and manager-core consistency
    runs-on: ubuntu-latest
    steps:
      # THIS REPOSITORY FIRST, ON PURPOSE, AND NOT BY ACCIDENT.
      #
      # actions/checkout runs `clean: true`, which deletes the CONTENTS OF
      # $GITHUB_WORKSPACE before it clones. $GITHUB_WORKSPACE is the default
      # path (an empty `path:`), so with the sibling checkouts already at
      # projects/*, this step wipes every one of them -- and the run then
      # dies a step later with
      #
      #   error: An error occurred trying to start process
      #   '/usr/bin/bash' with working directory
      #   '.../projects/pi-manager-core'. No such file or directory
      #
      # which reads like a checkout that never happened and is actually one
      # that was deleted. Every sibling checkout must therefore come AFTER
      # this step.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is not optional: package.json declares
      # peerDependencies: { "pi-manager-core": "*" }, the documented shape
      # for a Pi package (docs/packages.md), so plain `npm ci` fails with
      # 404 on a package that was never published.
      - name: install pi-blender
        run: npm ci --legacy-peer-deps

      # ----------------------------------------------------------------------
      # WHY A STEP-LEVEL GATE AND NOT A JOB-LEVEL ONE
      #
      # `secrets` is not an allowed context in ANY `if`: the job-level list is
      # github/needs/vars/inputs, the step-level list is the same plus
      # strategy/job/runner/env/steps. Writing `secrets.CONSUMER_TOKEN != ''`
      # in an `if` does not evaluate false, it fails the whole workflow file
      # with no jobs at all. So "is there a token" cannot be asked in an
      # `if` at all, and the only honest way to branch on it is to MOVE it
      # into a step's output, where `steps.<id>.outputs` IS an allowed
      # context -- and only for steps defined ABOVE the one that reads it,
      # which is why this step is here and not further down.
      #
      # Note what this step does NOT do: it cannot fail the run. Presence is
      # not reachability, so this succeeding is not a licence to skip
      # anything. `coverage-audit` is what turns an unusable token into a
      # red run.
      - name: detect the cross-repo token
        id: token
        env:
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
        run: |
          if [ -n "${CONSUMER_TOKEN}" ]; then
            echo "has_token=1" >> "$GITHUB_OUTPUT"
            echo "CONSUMER_TOKEN is set."
          else
            echo "has_token=" >> "$GITHUB_OUTPUT"
            echo "CONSUMER_TOKEN is not set on this repository."
            echo "::warning title=cross-repo checks will be skipped::The" \
              "sibling checkout and the four cross-repo consistency" \
              "checks need secrets.CONSUMER_TOKEN. The coverage-audit" \
              "job in this workflow FAILS when it is missing, so this" \
              "run is not green on account of that skip."
          fi

      # ----------------------------------------------------------------------
      # STEP 1 of 2: everything that needs NOTHING but this checkout. No
      # CONSUMER_TOKEN, no sibling repository, no pi-manager-core checkout.
      #
      # AND NOTHING ELSE GOES HERE, because "needs nothing" is a much
      # narrower claim than it looks and this step was previously built on a
      # measurement of 210 tests that was wrong. It ran them, they passed, and
      # the reason they passed was that the worktree pi-blender was measured in
      # sits next to a real ../pi-manager-core checkout, which the resolver
      # finds as its third candidate -- so pointing PI_MANAGER_CORE_DIR at a
      # missing directory proved nothing, because the resolver treats a
      # set-but-absent override as "looked there, not found" and falls
      # through. The first CI run on this branch is what caught it:
      #
      #   Error: manager-core could not be found. Looked in:
      #   PI_MANAGER_CORE_DIR; pi's installed extensions dir
      #   (/home/runner/work/_temp/agent-dir/extensions/manager-core);
      #   a sibling checkout of manager-core; a sibling checkout of
      #   pi-manager-core.
      #   ...
      #   # tests 71
      #   # pass 26
      #   # fail 45
      #
      # So this list is now MEASURED, not reasoned: each file was run on its
      # own from a `git archive` export -- no sibling checkout, no installed
      # extensions dir, PI_MANAGER_CORE_DIR pointed at a directory that does
      # not exist -- which is the state this step creates. Exactly four files
      # and 26 tests survive:
      #
      #   concurrency-budget.test.mjs   11
      #   module-paths.test.mjs          7
      #   tool-params.test.mjs           3
      #   windowless-tools.test.mjs      5
      #
      # Every other file fails at import on one hard error --
      # manager-core.ts's describeMissingCore(), reached through
      # config.ts:85, which loads the resolver shim at module scope. A suite
      # that fails wholesale on a missing setup step verifies nothing, says
      # nothing about the commit, and gives a reader no way to tell which of
      # the two they are looking at. So the list is spelled out rather than
      # derived from `ls test/*.test.mjs`: a new test file is unverified by
      # default and has to be added here, which is the safe direction for a
      # mistake in the other one.
      - name: typecheck and the four core-free suites
        env:
          PI_MANAGER_CORE_DIR: ${{ runner.temp }}/absent-manager-core
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        run: |
          mkdir -p "$PI_AGENT_DIR"
          npm run typecheck
          node --test \
            test/concurrency-budget.test.mjs \
            test/module-paths.test.mjs \
            test/tool-params.test.mjs \
            test/windowless-tools.test.mjs

      # ----------------------------------------------------------------------
      # STEP 1b: the other 22 files, in a layout where the core CAN be found.
      #
      # This is where the bulk of pi-blender's suite belongs, and it needs the
      # same checkout step 2 does -- so it is here, after that checkout, not
      # in step 1 pretending to be token-free.
      #
      # The two suites step 2 exists for are NOT here: they stage this
      # extension into a temp dir by copying launch.ts, config.ts and
      # manager-core.ts, and then drive the COPY -- so the copy's candidates
      # are its own temp-dir siblings plus the installed extensions dir, and
      # neither can be a checkout. They need PI_MANAGER_CORE_DIR to be an
      # absolute path they inherit, which is what step 2's env supplies.

      # ----------------------------------------------------------------------
      # STEP 2 of 2: the checks that genuinely need a sibling checkout.
      #
      # The old comment here said "there is no token-free job in this
      # repository", and named 17 launch-guard and watch-window checks that
      # ask where pi-manager-core is. That was true only because
      # test/launch-harness.mjs stages this extension into a temp dir by
      # copying launch.ts, config.ts and manager-core.ts, and then drives
      # the COPY -- so the copy's candidates are its own temp-dir siblings
      # plus the installed extensions dir, and neither can be a checkout.
      #
      # So the shim in the staged copy needs an absolute path, and
      # PI_MANAGER_CORE_DIR is exactly that: it is the FIRST candidate,
      # before the installed dir and before the sibling checkouts (see
      # candidateDirs() in manager-core.ts). Pointing it at
      # projects/pi-manager-core makes the staged copy find the same core a
      # real session would, which is what turns those 17 from unanswerable
      # into answerable.
      #
      # THE TOKEN IS A SEPARATE MATTER: pi-manager-core is a PRIVATE
      # repository, github.token cannot read it, and the checkout needs
      # secrets.CONSUMER_TOKEN. With no token the steps below are skipped,
      # the unverified files are named in this job's step summary, and
      # coverage-audit fails the run -- loudly, and on purpose.
      #
      # SHALLOW, ON PURPOSE, and for a reason worth writing down: a
      # previous attempt at this checked out the sibling's branch history
      # and needed `fetch-depth: 0` to make resolver-copies.mjs's diff
      # meaningful. It does not need one -- the core's own CI is what
      # enforces that contract across all three consumers -- and the full
      # history of a private repository is exactly the token's worth of
      # surface to hand to steps that have no use for it.
      - name: check out pi-manager-core
        if: ${{ steps.token.outputs.has_token == '1' }}
        uses: actions/checkout@v5
        with:
          repository: luxuride-pi-extensions/pi-manager-core
          ref: master
          path: projects/pi-manager-core
          token: ${{ secrets.CONSUMER_TOKEN }}
          fetch-depth: 1

      # The core's own dependency install, and not just its files: jiti is
      # a transitive dependency of @earendil-works/pi-coding-agent, so
      # this is the only place on a clean runner where the loader these
      # tests need exists.
      - name: install the manager core
        if: ${{ steps.token.outputs.has_token == '1' }}
        working-directory: projects/pi-manager-core
        run: npm ci

      # The 22 files that step 1 could not run, now against a core that
      # actually exists. This is the bulk of pi-blender's suite, so it is
      # worth being explicit that it is here BECAUSE it needs the sibling
      # checkout: `git ls-remote` in coverage-audit proves the token works,
      # and this step is the first thing that would notice if it did not.
      #
      # blender-probes.test.mjs and branch-e2e.test.mjs are in this group and
      # NOT in step 1 for a second reason as well: they launch a real
      # Blender, so they take minutes rather than seconds.
      - name: the rest of the suite, against the core
        if: ${{ steps.token.outputs.has_token == '1' }}
        env:
          PI_MANAGER_CORE_DIR: ${{ github.workspace }}/projects/pi-manager-core
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        run: |
          node --test \
            $(ls test/*.test.mjs \
                | grep -v -e launch-guard -e watch-window \
                          -e concurrency-budget -e module-paths \
                          -e tool-params -e windowless-tools)

      # The same two suites step 2 exists for, now with
      # PI_MANAGER_CORE_DIR pointing at a core that actually exists.
      - name: launch and watch-window suites, against the core
        if: ${{ steps.token.outputs.has_token == '1' }}
        env:
          PI_MANAGER_CORE_DIR: ${{ github.workspace }}/projects/pi-manager-core
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        run: |
          node --test test/launch-guard.test.mjs \
                          test/watch-window.test.mjs

      # The core's own cross-repo checks, against the checkout beside it:
      # resolver-copies diffs this repo's manager-core.ts and
      # agent-template-checks.mjs against the canonical files, allowlists
      # asserts every tool this manager's prompt names is in the index.ts
      # allowlist, and dependency-declaration asserts the peer range.
      #
      # pi-manager-core's CI runs these same checks against all three
      # consumers. Running them here too means a change here fails a check
      # in the PR that made it, instead of only in the core's next run.
      - name: cross-repo consistency checks
        if: ${{ steps.token.outputs.has_token == '1' }}
        working-directory: projects/pi-manager-core
        run: |
          for check in resolver-copies \
                       dependency-declaration \
                       allowlists agent-rosters; do
            echo "==> $check"
            node test/$check.mjs
          done

      # And, when there is NO token: the two suites step 2 could not answer,
      # run anyway so the number is measured rather than asserted here.
      # continue-on-error because the run is ALREADY being failed by
      # coverage-audit for the same reason; without it this job would be red
      # for a reason the reader has to be told is the one they can see
      # there.
      #
      # Only these two. The 22 files step 1b now carries are not run here:
      # without a core they fail wholesale on describeMissingCore(), which
      # measures the missing checkout rather than the commit and buries the
      # real signal under 40 identical failures. What they cost is 184 tests
      # NOT VERIFIED, which is what the step summary below reports and what
      # coverage-audit turns into a red run.
      - name: the core-dependent suites, unsatisfiable without a token
        if: ${{ steps.token.outputs.has_token != '1' }}
        env:
          PI_MANAGER_CORE_DIR: ${{ runner.temp }}/absent-manager-core
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        continue-on-error: true
        run: |
          node --test test/launch-guard.test.mjs \
                          test/watch-window.test.mjs

      - name: say what was left unverified
        if: ${{ steps.token.outputs.has_token != '1' }}
        run: |
          {
            echo "### Most of this repository's suite was NOT verified"
            echo
            echo "26 tests ran, in 4 files: concurrency-budget,"
            echo "module-paths, tool-params and windowless-tools."
            echo "Those are the only files measured to pass without a"
            echo "pi-manager-core checkout."
            echo
            echo '`test/launch-guard.test.mjs` and'
            echo '`test/watch-window.test.mjs` stage this extension into a'
            echo 'temp dir and ask it where pi-manager-core is, and'
            echo 'nothing answered. The step above ran them anyway, so'
            echo 'that number is measured rather than assumed.'
            echo
            echo 'The other 22 test files need the same checkout and were'
            echo 'not run at all: 184 tests NOT VERIFIED. Running them'
            echo 'without it would fail all 22 on one describeMissingCore()'
            echo 'error, which measures the missing checkout rather than'
            echo 'this commit.'
            echo
            echo '`coverage-audit` is failing this run for the same'
            echo 'reason: `secrets.CONSUMER_TOKEN` is not set.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # THE ALWAYS-RUNNING AUDIT.
  #
  # A sibling of `test` with no `if` at all, so it executes on every trigger
  # and its conclusion is a fact about the configuration rather than about
  # whether a gate happened to be open today. It cannot be green in a run
  # that verified nothing, because that is exactly what it fails on.
  #
  #   token absent -> it fails, and says what setting it would change.
  #   token set    -> it lists pi-manager-core's refs over HTTPS and
  #                   proves the sibling checkout in `test` can read them.
  #                   A revoked or expired PAT fails HERE, which is the one
  #                   case the detect step above cannot see.
  #
  # Why "absent" is a failure rather than a skip: this repository's suite is
  # 231 tests in 26 files, and 205 of them cannot run without a core
  # checkout -- 4 files and 26 tests do, measured from a `git archive` export
  # with PI_MANAGER_CORE_DIR pointed at a directory that does not exist, and
  # the two staging suites measured separately with the core present (21
  # pass). A run that quietly verified 26 of 231 while reporting success is
  # the failure mode this job exists to prevent, and it is worse than an
  # outright red because it is invisible.
  #
  # To make this green: add `secrets.CONSUMER_TOKEN` (a PAT with read
  # access to luxuride-pi-extensions) under Settings -> Secrets -> Actions.
  # The old `CONSUMER_REPOS_ENABLED` variable is no longer read by this
  # workflow and can be deleted.
  # ===========================================================================
  coverage-audit:
    name: the sibling checkout must be verifiable, not assumed
    runs-on: ubuntu-latest
    steps:
      - name: assert the cross-repo checkout is reachable
        env:
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
          EXPECTED_BRANCH: >-
            ${{ github.event_name == 'pull_request' && github.base_ref
            || 'master' }}
        run: |
          set -euo pipefail

          if [ -z "${CONSUMER_TOKEN}" ]; then
            echo "::error title=CI is verifying less than it looks::" \
              "CONSUMER_TOKEN is not set on this repository, so the" \
              "sibling checkout, the launch and watch-window suites" \
              "against it, and the four cross-repo consistency checks" \
              "were skipped, and 205 of the 231 tests in pi-blender" \
              "cannot run without a core checkout -- 4 of 26 files can." \
              "This run is" \
              "reported as FAILING on purpose: the alternative is a" \
              "green run in which nothing was verified. The reasoning" \
              "is in full in .github/workflows/ci.yml."
            echo "::error title=CONSUMER_REPOS_ENABLED is obsolete::That" \
              "repository VARIABLE used to gate the only job in this" \
              "workflow, which made an unset variable mean" \
              "success-with-zero-jobs. It is no longer read by this" \
              "workflow; you can delete it."
            exit 1
          fi

          echo "::group::resolving pi-manager-core"
          # HTTPS rather than an SSH remote even though the token is a PAT:
          # an SSH agent on the runner image is a second moving part, and
          # this check exists to measure ONE thing.
          #
          # Heads only, and no history: a reachability probe has no use for
          # the history and the token should not be spent fetching it. The
          # branch is the base branch for a PR and master otherwise, so an
          # empty result on a PR names the branch it tried rather than just
          # reporting "no refs".
          url="https://x-access-token:${CONSUMER_TOKEN}"
          url="$url@github.com/luxuride-pi-extensions"
          url="$url/pi-manager-core.git"
          if git ls-remote --heads "$url" "$EXPECTED_BRANCH" \
            | grep -q .; then
            echo "ok pi-manager-core $EXPECTED_BRANCH is reachable" \
              "with CONSUMER_TOKEN"
          else
            {
              echo "pi-manager-core $EXPECTED_BRANCH is NOT reachable."
              echo "An empty result here means the secret is wrong,"
              echo "expired, or lacks access to the private"
              echo "luxuride-pi-extensions/pi-manager-core."
              echo "Set secrets.CONSUMER_TOKEN to a PAT with read"
              echo "access and re-run."
            } >&2
            exit 1
          fi
          echo "::endgroup::"

          # A second fact, stated in the log rather than left implicit:
          # with the token present the gate above is open and `test` really
          # did run everything. Without this line the green case and the
          # near-miss case are told apart only by an `if:`.
          echo "CONSUMER_TOKEN is set, so 'test' ran the sibling" \
            "checkout, the launch and watch-window suites against it," \
            "and the four cross-repo consistency checks."
