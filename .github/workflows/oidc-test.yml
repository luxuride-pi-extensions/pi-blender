name: oidc-test
on: workflow_dispatch
permissions:
  id-token: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm install -g npm@11 >/dev/null 2>&1
          npm --version
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm_registry" | head -c 60)
          echo "id-token fetch: ${TOKEN:0:40}"
